spring:
  application:
    name: wusd-bridge

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wusd}
    username: ${DB_USER:wusd}
    password: ${DB_PASSWORD:wusd_dev_password}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 2000
      pool-name: wusd-hikari

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.example.wusd.bridge: DEBUG
